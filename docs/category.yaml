paths:
  /categories:
    post:
      security:
        - cookieAuth: []
      tags:
        - Category
      summary: Create a new category
      parameters:
        required: false
      description: Create a new category
      produces:
        - application/json
      requestBody:
        required: true
        description: Category object that needs to be added
        content:
          application/json:
            schema:
              $ref: '#/definitions/create'
            example:
              name: Category 1
              icon: mocked-path-to-icon
              color: '#66C42C'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/definitions/createResponse'
              example:
                _id: 67113a5f2ace5dcff0fa65b6
                name: category 1
                totalOffers: '0'
                appearance:
                  icon: mocked-path-to-icon
                  color: '#66C42C'
                createdAt: 2024-10-17T16:25:03.678Z
                updatedAt: 2024-10-17T16:25:03.678Z
    get:
      security:
        - cookieAuth: []
      tags:
        - Category
      summary: Get all categories with parameters'
      description: Get all categories with parameters
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Category name
        - in: query
          name: asc
          required: false
          schema:
            type: string
          description: Sort field
        - in: query
          name: 0
          required: false
          schema:
            type: integer
          description: Skip records
        - in: query
          name: 10
          required: false
          schema:
            type: integer
          description: Limit records
      produces:
        - application/json
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: Object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    $ref: '#/definitions/findAllResponse'
              example:
                count: 1
                items:
                  - _id: 67113a5f2ace5dcff0fa65b6
                    name: category 1
                    appearance:
                      icon: mocked-path-to-icon
                      color: '#66C42C'
                    totalOffers: 0
                    createdAt: 2024-10-17T16:25:03.678Z
                    updatedAt: 2024-10-17T16:25:03.678Z
                  - _id: 67113a5f2ace5dcff0fa65b7
                    name: category 2
                    appearance:
                      icon: mocked-path-to-icon
                      color: '#66C42C'
                    totalOffers: 0
                    createdAt: 2024-10-17T16:25:03.678Z
                    updatedAt: 2024-10-17T16:25:03.678Z
  /categories/names:
    get:
      security:
        - cookieAuth: []
      tags:
        - Category
      summary: Get all categories names with parameters
      description: Get all categories names with parameters
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Category name
        - in: query
          name: asc
          required: false
          schema:
            type: string
          description: Sort field
        - in: query
          name: 0
          required: false
          schema:
            type: integer
          description: Skip records
        - in: query
          name: 100
          required: false
          schema:
            type: integer
          description: Limit records
      produces:
        - application/json
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/definitions/findManyNamesResponse'
              example:
                count: 1
                items:
                  - _id: 67113a5f2ace5dcff0fa65b6
                    name: category 1
                  - _id: 67113a5f2ace5dcff0fa65b7
                    name: category 2
  /categories/{id}:
    get:
      security:
        - cookieAuth: []
      tags:
        - Category
      summary: Get category by id
      description: Get category by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Category id
      produces:
        - application/json
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/definitions/findOneByIdResponse'
              example:
                _id: 67113a5f2ace5dcff0fa65b6
                name: category 1
                totalOffers: '0'
                appearance:
                  icon: mocked-path-to-icon
                  color: '#66C42C'
                createdAt: 2024-10-17T16:25:03.678Z
                updatedAt: 2024-10-17T16:25:03.678Z
