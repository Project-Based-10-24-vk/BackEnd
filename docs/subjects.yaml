paths:
  /subjects:
    get:
      security:
        - cookieAuth: []
      tags:
        - Subject
      summary: Get all subjects with parameters
      description: Returns a list of all subjects with their id, name, and category.
      parameters:
        - in: query
          name: name
          value: 'Subject 1'
          required: false
          schema:
            type: string
          description: Subject name
        - in: query
          name: category
          value: '670fbe3b702a8fef395d6d6c'
          required: false
          schema:
            type: string
          description: Category ID the subject belongs to
        - in: query
          name: sort
          value: { 'orderBy': 'createdAt', 'order': 'desc' }
          required: false
          schema:
            type: object
          description: Sort field
        - in: query
          name: skip
          value: 0
          required: false
          schema:
            type: integer
          description: Skip records
        - in: query
          name: limit
          value: 10
          required: false
          schema:
            type: integer
          description: Limit records
      produces:
        - application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of subjects
                    example: 10
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: The unique identifier of the subject
                          example: '67113c01df0ec401f6efd300'
                        name:
                          type: string
                          description: The name of the subject
                          example: 'Mathematics'
                        category:
                          type: string
                          description: The category id the subject belongs to
                          example: '670fbe3b702a8fef395d6d6c'
                        createdAt:
                          type: string
                          description: The date and time the subject was created
                          example: '2024-10-17T16:25:03.678Z'
                        updatedAt:
                          type: string
                          description: The date and time the subject was last updated
                          example: '2024-10-17T16:25:03.678Z'
  /subjects/names:
    get:
      security:
        - cookieAuth: []
      tags:
        - Subject
      summary: Get all subject names
      description: Returns a list of all subject names.
      parameters:
        - in: query
          name: name
          value: 'Subject 1'
          required: false
          schema:
            type: string
          description: Subject name
        - in: query
          name: category
          value: '670fbe3b702a8fef395d6d6c'
          required: false
          schema:
            type: string
          description: Category ID the subject belongs to
        - in: query
          name: sort
          value: { 'orderBy': 'createdAt', 'order': 'desc' }
          required: false
          schema:
            type: object
          description: Sort field
        - in: query
          name: skip
          value: 0
          required: false
          schema:
            type: integer
          description: Skip records
        - in: query
          name: limit
          value: 10
          required: false
          schema:
            type: integer
          description: Limit records
      produces:
        - application/json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of subjects
                    example: 10
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: The unique identifier of the subject
                          example: '67113a5f2ace5dcff0fa65b6'
                        name:
                          type: string
                          description: The name of the subject
                          example: 'Mathematics'
  /subjects/{id}:
    get:
      summary: Get subject by ID
      description: Returns the details of a subject by its ID.
      tags:
        - Subject
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      produces:
        - application/json
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: The unique identifier of the subject
                    example: '67113c01df0ec401f6efd300'
                  name:
                    type: string
                    description: The name of the subject
                    example: 'Subject 1'
                  category:
                    type: string
                    description: The category id the subject belongs to
                    example: '670fbe3b702a8fef395d6d6c'
                  createdAt:
                    type: string
                    description: The date and time the subject was created
                    example: '2024-10-17T16:25:03.678Z'
                  updatedAt:
                    type: string
                    description: The date and time the subject was last updated
                    example: '2024-10-17T16:25:03.678Z'
    post:
      summary: Create a new subject
      description: Adds a new subject to the database.
      tags:
        - Subject
      parameters:
        - in: path
          name: id
          required: true
          description: Subject ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the new subject
                  example: 'Physics'
                category:
                  type: string
                  description: The category ID for the new subject
                  example: 670fbe3b702a8fef395d6d6c
      responses:
        201:
          description: Subject created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: The unique identifier of the newly created subject
                    example: '67113c01df0ec401f6efd301'
                  name:
                    type: string
                    description: The name of the newly created subject
                    example: 'Physics'
                  category:
                    type: string
                    description: The category ID the subject belongs to
                    example: '670fbe3b702a8fef395d6d6c'
                  createdAt:
                    type: string
                    description: The date and time the subject was created
                    example: '2024-10-17T16:25:03.678Z'
                  updatedAt:
                    type: string
                    description: The date and time the subject was last updated
                    example: '2024-10-17T16:25:03.678Z'
    patch:
      summary: Update a subject
      description: Updates an existing subject by its ID.
      tags:
        - Subject
      parameters:
        - in: path
          name: id
          value: 67113c01df0ec401f6efd300
          required: true
          schema:
            type: string
          description: Subject ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new name of the subject
                  example: 'Advanced Mathematics'
                category:
                  type: string
                  description: The new category ID for the subject
                  example: '670fbe3b702a8fef395d6d6c'
      responses:
        200:
          description: Subject updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    description: The unique identifier of the updated subject
                    example: '67113c01df0ec401f6efd300'
                  name:
                    type: string
                    description: The name of the updated subject
                    example: 'Advanced Mathematics'
                  category:
                    type: string
                    description: The updated category ID
                    example: '670fbe3b702a8fef395d6d6c'
                  createdAt:
                    type: string
                    description: The date and time the subject was created
                    example: '2024-10-17T16:25:03.678Z'
                  updatedAt:
                    type: string
                    description: The date and time the subject was last updated
                    example: '2024-10-17T16:25:03.678Z'
    delete:
      summary: Delete a subject
      description: Deletes a subject by its ID.
      tags:
        - Subject
      parameters:
        - in: path
          name: id
          value: 67113c01df0ec401f6efd300
          required: true
          schema:
            type: string
          description: Subject ID
      responses:
        204:
          description: Subject deleted successfully
